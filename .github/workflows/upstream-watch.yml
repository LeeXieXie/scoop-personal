name: Upstream Watch

on:
  workflow_dispatch:
  schedule:
    # Check every 5 minutes, away from the start of the hour (UTC).
    - cron: '2-57/5 * * * *'
  pull_request:
    paths:
      - 'scripts/upstream_watch.py'
      - 'scripts/test_upstream_watch.py'
      - 'scripts/zcode-checkver.json'
      - '.github/workflows/upstream-watch.yml'
      - 'bucket/*.json'

permissions:
  contents: read

concurrency:
  group: upstream-watch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  watcher-tests:
    name: Offline upstream watcher tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_upstream_watch.py' -v
  watch:
    name: Check all bucket releases
    needs: watcher-tests
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check all releases and trigger Excavator
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: python3 scripts/upstream_watch.py --dispatch --output "$RUNNER_TEMP/upstream-watch.json"

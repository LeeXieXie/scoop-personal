name: Excavator

on:
  workflow_dispatch:
  schedule:
    # run every 4 hours
    - cron: '20 */4 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: excavator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Excavate
        uses: ScoopInstaller/GithubActions@5bceeda181721d9d10a18fdcc3ddca6f33467ae6 # v3.0.0
        env:
          SKIP_UPDATED: 1
          THROW_ERROR: 1
      - name: Trigger CI for bot-dispatched update
        if: github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPDATE_BRANCH: ${{ github.ref_name }}
        run: |
          gh workflow run ci.yml --ref $env:UPDATE_BRANCH
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to trigger CI for bot-dispatched update."
          }

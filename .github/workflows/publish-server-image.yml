name: Publish Server Image

on:
  push:
    branches: [master]
    paths:
      - scripts/server_upstream_timer.py
      - scripts/test_server_upstream_timer.py
      - deploy/server-timer/Dockerfile
      - .github/workflows/publish-server-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-server-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master' && github.repository == 'LeeXieXie/scoop-personal'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Regression tests
        run: python3 -m unittest discover -s scripts -p 'test_server_upstream_timer.py' -v
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and publish prebuilt image
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f deploy/server-timer/Dockerfile \
            --tag ghcr.io/leexiexie/scoop-upstream-timer:1.0.2 \
            --tag ghcr.io/leexiexie/scoop-upstream-timer:latest \
            --tag "ghcr.io/leexiexie/scoop-upstream-timer:sha-${GITHUB_SHA}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=1.0.2" \
            --push .
      - name: Verify published image without registry login
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker logout ghcr.io
          export DOCKER_CONFIG="$(mktemp -d)"
          for tag in 1.0.2 latest "sha-${GITHUB_SHA}"; do
            docker buildx imagetools inspect "ghcr.io/leexiexie/scoop-upstream-timer:${tag}" --raw |
              python3 -c 'import json,sys; manifests=json.load(sys.stdin)["manifests"]; platforms={(item["platform"]["os"], item["platform"]["architecture"]) for item in manifests}; assert {("linux", "amd64"), ("linux", "arm64")} <= platforms; print("Verified linux/amd64 and linux/arm64 manifests")'
          done
          docker pull ghcr.io/leexiexie/scoop-upstream-timer:latest
          test "$(docker image inspect ghcr.io/leexiexie/scoop-upstream-timer:latest --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          docker pull ghcr.io/leexiexie/scoop-upstream-timer:1.0.2
          test "$(docker image inspect ghcr.io/leexiexie/scoop-upstream-timer:1.0.2 --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint python ghcr.io/leexiexie/scoop-upstream-timer:1.0.2 \
            -c 'import server_upstream_timer as timer; assert timer.Config().interval == 180; print("Verified default interval: 180 seconds")'
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            ghcr.io/leexiexie/scoop-upstream-timer:1.0.2 --help
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --env GH_TOKEN ghcr.io/leexiexie/scoop-upstream-timer:1.0.2 --check
          for arch in amd64 arm64; do
            platform_digest="$(docker buildx imagetools inspect ghcr.io/leexiexie/scoop-upstream-timer:1.0.2 --raw |
              python3 -c 'import json,sys; manifests=json.load(sys.stdin)["manifests"]; print(next(item["digest"] for item in manifests if item["platform"].get("os") == "linux" and item["platform"].get("architecture") == sys.argv[1]))' "$arch")"
            platform_image="ghcr.io/leexiexie/scoop-upstream-timer@${platform_digest}"
            docker pull --platform "linux/${arch}" "$platform_image"
            test "$(docker image inspect "$platform_image" --format '{{.Architecture}}')" = "$arch"
            test "$(docker image inspect "$platform_image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
            test "$(docker image inspect "$platform_image" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "1.0.2"
            docker run --rm --platform "linux/${arch}" --read-only --network none \
              --cap-drop ALL --security-opt no-new-privileges \
              --tmpfs /tmp:rw,noexec,nosuid,size=1m,mode=1777 \
              --mount "type=bind,source=${PWD}/scripts/test_server_upstream_timer.py,target=/app/test_server_upstream_timer.py,readonly" \
              --entrypoint python "$platform_image" \
              -m unittest -v test_server_upstream_timer
          done

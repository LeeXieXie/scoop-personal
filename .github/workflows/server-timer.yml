name: Server Timer

on:
  push:
    branches: [master, main]
    paths:
      - 'scripts/server_upstream_timer.py'
      - 'scripts/test_server_upstream_timer.py'
      - 'deploy/server-timer/**'
      - '.github/workflows/server-timer.yml'
  pull_request:
    paths:
      - 'scripts/server_upstream_timer.py'
      - 'scripts/test_server_upstream_timer.py'
      - 'deploy/server-timer/**'
      - '.github/workflows/server-timer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run server timer regression tests
        run: python3 -m unittest discover -s scripts -p 'test_server_upstream_timer.py' -v
      - name: Validate systemd and Compose configuration
        run: |
          systemd-analyze verify deploy/server-timer/scoop-upstream.service deploy/server-timer/scoop-upstream.timer
          docker compose -f deploy/server-timer/compose.yml config --quiet
          docker compose -f deploy/server-timer/compose.baota.yml config --quiet
      - name: Build deployment image and verify CLI
        run: |
          docker build -f deploy/server-timer/Dockerfile -t scoop-server-timer:test .
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges scoop-server-timer:test --help
      - name: Verify prebuilt BaoTa image and environment-only deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          docker compose -f deploy/server-timer/compose.baota.yml pull
          docker compose -f deploy/server-timer/compose.baota.yml config --format json | python3 -c 'import json,sys; c=json.load(sys.stdin)["services"]["scheduler"]; assert c["command"] == ["--interval", "180"]; assert "ports" not in c and "volumes" not in c and "build" not in c; assert c["read_only"] and c["user"] == "10001:10001"; assert "GH_TOKEN" in c["environment"] and "GH_TOKEN_FILE" not in c["environment"]'
          docker compose -f deploy/server-timer/compose.baota.yml run --rm --no-deps scheduler --help
          docker compose -f deploy/server-timer/compose.baota.yml run --rm --no-deps -e GH_TOKEN scheduler --check
          docker compose -f deploy/server-timer/compose.baota.yml run --rm --no-deps -e GH_TOKEN scheduler --check --interval 180

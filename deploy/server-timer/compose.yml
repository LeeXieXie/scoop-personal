services:
  scheduler:
    build:
      context: ../..
      dockerfile: deploy/server-timer/Dockerfile
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      GH_TOKEN_FILE: /run/secrets/github_token
    secrets:
      - github_token
    tmpfs:
      - /tmp:size=1m,mode=1777
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
secrets:
  github_token:
    file: ./github-token

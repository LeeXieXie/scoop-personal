# 宝塔：Docker -> 容器编排 -> 创建，粘贴后填写 GH_TOKEN。
services:
  scheduler:
    image: ghcr.io/leexiexie/scoop-upstream-timer:latest
    container_name: scoop-upstream-timer
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      GH_TOKEN: "在这里填写你的GitHubToken"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    command: ["--interval", "180"]
    tmpfs:
      - /tmp:size=1m,mode=1777
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
